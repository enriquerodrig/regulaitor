repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # H16 carry: lance binary files (Protobuf manifests + data fragments)
        # get corrupted if end-of-file-fixer appends a newline. .gitattributes
        # marks them as binary but the hook doesn't always respect that.
        # Belt-and-suspenders exclude pattern.
        exclude: '^corpus/indexes/regulaitor\.lance/.*'
      - id: trailing-whitespace
        exclude: '^corpus/indexes/regulaitor\.lance/.*'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
