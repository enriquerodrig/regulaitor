# docker-compose.yml — local dev / staging for RegulAItor
# Usage:
#   docker compose up -d api          # FastAPI on http://localhost:8000
#   docker compose up -d streamlit    # Streamlit on http://localhost:8501
#   docker compose up -d frontend     # Next.js UI on http://localhost:3000 (Fase 5)
#   docker compose up -d              # all three
#
# Persistent volumes:
#   regulaitor-data: corpus/indexes (LanceDB) + HF model cache
#   Cold-start: ~15-20 min on first up (LanceDB build + BGE-M3 + reranker download)
#   Warm-start: <5s
#
# Secrets: create a `.env` file in repo root (gitignored). The project does NOT
# ship a `.env.example` (per user rule overriding CLAUDE.md §22.6). Minimum:
#   ANTHROPIC_API_KEY=sk-ant-...
#   REGULAITOR_API_TOKEN=<32+ random bytes for Bearer auth>
# Optional: OPENAI_API_KEY, GROQ_API_KEY, LANGFUSE_*, REGULAITOR_CORS_ORIGINS,
# REGULAITOR_RATE_LIMIT_ASK, REGULAITOR_RATE_LIMIT_ANALYZE, LANCEDB_PATH.
# See docs/H16_DEPLOY.md §2 "Env vars" for the full reference.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: regulaitor:dev
    container_name: regulaitor-api
    restart: unless-stopped
    environment:
      APP_MODE: api
      PORT: "8000"
      LANCEDB_PATH: /data/indexes
      HF_HOME: /data/hf_cache
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - regulaitor-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      # start_period generous to cover cold-start corpus build (~15-20 min) on
      # first up; subsequent restarts find the cached index and start <5s.
      start_period: 1200s
      retries: 3

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    image: regulaitor:dev
    container_name: regulaitor-streamlit
    restart: unless-stopped
    environment:
      APP_MODE: streamlit
      PORT: "8501"
      LANCEDB_PATH: /data/indexes
      HF_HOME: /data/hf_cache
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - regulaitor-data:/data
    depends_on:
      - api

  # Fase 5 (HX) — Next.js frontend. BFF pattern: the browser only needs :3000;
  # the Next server reaches the FastAPI backend over the internal compose network
  # (REGULAITOR_API_URL), so no CORS and the api port need not be public.
  frontend:
    build:
      context: ./frontend_next
      dockerfile: Dockerfile
    image: regulaitor-frontend:dev
    container_name: regulaitor-frontend
    restart: unless-stopped
    environment:
      REGULAITOR_API_URL: http://api:8000
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  regulaitor-data:
    name: regulaitor-data
