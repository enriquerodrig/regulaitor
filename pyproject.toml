[project]
name = "regulaitor"
version = "0.0.1"
description = "Multi-agent regulatory compliance service with strict citation verification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "RegulAItor" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<11.0",
    "ruff>=0.7,<0.10",
    "black>=26.3.1,<28.0",
    "mypy>=1.11,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=3.8,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regulaitor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# strict = true   # enable in H10 per CLAUDE.md §10.6

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
