[project]
name = "regulaitor"
version = "0.0.1"
description = "Multi-agent regulatory compliance service with strict citation verification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "RegulAItor" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "lxml>=6.1.0,<8.0",
    "beautifulsoup4>=4.12,<5.0",
    "tenacity>=8.5,<10.0",
    "pydantic>=2.9,<3.0",
    "pdfplumber>=0.11,<0.13",
    "FlagEmbedding>=1.3,<2.0",
    "transformers>=4.44,<5.0",
    "lancedb>=0.16,<1.0",
    "pyarrow>=18.0,<22.0",
    "mcp>=1.0,<2.0",
    "anthropic>=0.40,<1.0",
    "langgraph>=1.0.10,<2.0",
    "langgraph-checkpoint>=4.0.0,<5.0",
    "nanoid>=2.0,<3.0",
    "markdown-it-py>=3.0,<4.0",
    "pypdfium2>=4.30,<5.0",
    "pikepdf>=9.0,<10.0",
    "streamlit>=1.40,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "slowapi>=0.1.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<11.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.0,<7.0",
    "ruff>=0.7,<0.10",
    "black>=26.3.1,<28.0",
    "mypy>=1.11,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=3.8,<5.0",
    "reportlab>=4.0,<5.0",
    "schemathesis>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regulaitor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# strict = true   # enable in H10 per CLAUDE.md §10.6

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "lancedb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "FlagEmbedding.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nanoid"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdfium2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pikepdf"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pikepdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "src/regulaitor/corpus",
    "src/regulaitor/rag",
    "src/regulaitor/citation",
    "src/regulaitor/agents",
    "src/regulaitor/mcp_server",
    "src/regulaitor/models",
    "src/regulaitor/orchestration",
    "src/regulaitor/security",
    "src/regulaitor/document",
    "src/regulaitor/ui_streamlit",
]
branch = true

[tool.coverage.report]
# NOTE: fail_under is enforced by --cov-fail-under in pytest addopts
# (currently 0 = disabled). Task 10 will raise both to 90.
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers --cov=src/regulaitor/corpus --cov=src/regulaitor/rag --cov=src/regulaitor/citation --cov=src/regulaitor/agents --cov=src/regulaitor/mcp_server --cov=src/regulaitor/models --cov=src/regulaitor/orchestration --cov=src/regulaitor/security --cov=src/regulaitor/document --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: integration tests using stub HTTP server",
    "contract: contract tests using hypothesis",
    "slow: tests that load real ML models (only in cached CI)",
    "document_slow: H5 document E2E tests — load BGE-M3, real corpus, real Anthropic API",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
