[project]
name = "regulaitor"
version = "1.0.0"
description = "Multi-agent regulatory compliance service with strict citation verification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "RegulAItor" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "lxml>=6.1.0,<8.0",
    "beautifulsoup4>=4.12,<5.0",
    "tenacity>=8.5,<10.0",
    "pydantic>=2.9,<3.0",
    "pdfplumber>=0.11,<0.13",
    "FlagEmbedding>=1.3,<2.0",
    "transformers>=4.44,<5.0",
    # Capped <0.31: lancedb 0.34 changed the default cache dir to /var/cache/lancedb,
    # which is root-only on the Linux CI runner (PermissionError; passes on Windows
    # where the path differs). Stay on the known-good 0.30.x line. Re-evaluate + set an
    # explicit cache path when deliberately upgrading (roadmap P3.4 dep automation).
    "lancedb>=0.16,<0.31",
    "pyarrow>=18.0,<24.0",
    "mcp>=1.0,<2.0",
    "anthropic>=0.40,<2.0",  # widened from <1.0 per deep-review minor (HX upgrade window for 1.0 release)
    "langgraph>=1.0.10,<2.0",
    "langgraph-checkpoint>=4.0.0,<5.0",
    "nanoid>=2.0,<3.0",
    "markdown-it-py>=3.0,<4.0",
    "pypdfium2>=5.11.0,<6.0",
    "pikepdf>=9.0,<10.0",
    "streamlit>=1.40,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "slowapi>=0.1.9,<1.0",
    "truststore>=0.10,<1.0",
    # Multi-LLM router (ADR-0013 H12): production runtime imports these at
    # module load in src/regulaitor/models/router.py. Moved from dev section
    # to main dependencies for H16 deploy (Docker --no-dev install).
    "openai>=1.40,<2.0",
    "groq>=0.11,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<11.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.0,<7.0",
    "ruff>=0.7,<0.10",
    "black>=26.3.1,<28.0",
    "mypy>=1.11,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=3.8,<5.0",
    "reportlab>=4.0,<5.0",
    "schemathesis>=4.0,<5.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-randomly>=3.15,<4.0",
    "ragas>=0.2,<1.0",
    "langchain-anthropic>=0.3,<1.0",
    "langchain-huggingface>=1.0,<2.0",
    "langfuse>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regulaitor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# The retrieval-fixture generator holds curated full-sentence gold queries as data;
# E501 (line-too-long) on those Spanish query literals is acceptable in a data script.
"scripts/gen_retrieval_fixture.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "redteam"]
strict_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# strict = true   # enable in H10 per CLAUDE.md §10.6

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "lancedb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "FlagEmbedding.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "groq"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "groq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nanoid"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdfium2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pikepdf"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pikepdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "datasets"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_anthropic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_huggingface"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ragas"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ragas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langfuse"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langfuse.*"
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "src/regulaitor/api",
    "src/regulaitor/corpus",
    "src/regulaitor/rag",
    "src/regulaitor/citation",
    "src/regulaitor/agents",
    "src/regulaitor/mcp_server",
    "src/regulaitor/models",
    "src/regulaitor/orchestration",
    "src/regulaitor/security",
    "src/regulaitor/document",
    "src/regulaitor/observability",
    "src/regulaitor/ui_streamlit",
]
branch = true

[tool.coverage.report]
# NOTE: fail_under is enforced by --cov-fail-under in pytest addopts (v0.1.26: 85)
# (currently 0 = disabled). Task 10 will raise both to 90.
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# P1.4 professionalization hardening:
# - pytest-timeout: a per-test hang guard (thread method works on Windows too).
#   300s is generous for the TestClient/warmup-heavy integration tests while still
#   catching a true hang (a deadlocked daemon thread, a wedged network call).
# - pytest-randomly (auto-enabled once installed): randomizes test order every run so
#   hidden inter-test order-dependence surfaces instead of lurking. It prints the seed
#   to reproduce a failure.
timeout = 300
timeout_method = "thread"
addopts = "-ra -q --strict-markers --cov=src/regulaitor/api --cov=src/regulaitor/corpus --cov=src/regulaitor/rag --cov=src/regulaitor/citation --cov=src/regulaitor/agents --cov=src/regulaitor/mcp_server --cov=src/regulaitor/models --cov=src/regulaitor/orchestration --cov=src/regulaitor/security --cov=src/regulaitor/document --cov=src/regulaitor/observability --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: integration tests using stub HTTP server",
    "contract: contract tests using hypothesis",
    "slow: tests that load real ML models (only in cached CI)",
    "document_slow: H5 document E2E tests — load BGE-M3, real corpus, real Anthropic API",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
