name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bgem3-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-bgem3-
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Mypy
        run: uv run mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bgem3-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-bgem3-
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Pytest
        # Slow tests (BGE-M3 / bge-reranker-v2-m3 + live LanceDB index) require
        # `make ingest && make rag-build` to populate state that's gitignored;
        # they're local-only per spec H3 §11.3 and H2 §11.3.
        # Coverage gate 85% enforced; measured baseline 88.55% (v0.1.21.3 hotfix).
        run: uv run pytest -m "not slow" --cov=src --cov-report=xml --cov-fail-under=85

  redteam-smoke:
    name: Red Team Smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Run red team smoke
        run: uv run python -m scripts.redteam --smoke
      - name: Gate block_rate ≥0.90
        run: |
          block_rate=$(grep -E "block_rate \(final\):" redteam/reports/latest.md \
                       | grep -oE "[01]\.[0-9]+" | head -1)
          echo "Smoke block_rate: $block_rate"
          if [ -z "$block_rate" ]; then
            echo "❌ Could not extract block_rate"; exit 1
          fi
          if (( $(echo "$block_rate < 0.90" | bc -l) )); then
            echo "❌ Smoke block_rate $block_rate < 0.90 threshold"; exit 1
          fi
          echo "✅ Smoke block_rate $block_rate ≥ 0.90"
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-smoke-report
          path: redteam/reports/latest.md

  test-document-e2e:
    name: Document E2E (slow)
    # H5 closure: run the slow document_slow tests on main pushes and on PRs
    # touching the document pipeline. Adversarial fixture is verifiable without
    # ANTHROPIC_API_KEY (sanitizer short-circuits); clean PASS path skips
    # cleanly when the secret is absent.
    runs-on: ubuntu-latest
    # dorny/paths-filter@v3 needs pull-requests:read to list changed files on PRs.
    # contents:read is the default-restricted minimum for checkout.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Detect document pipeline changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            document:
              - 'src/regulaitor/document/**'
              - 'src/regulaitor/orchestration/document_graph.py'
              - 'src/regulaitor/security/injection.py'
              - 'src/regulaitor/security/allowlist.py'
              - 'scripts/analyze.py'
              - 'scripts/regenerate_document_fixtures.py'
              - 'evals/document_cases/**'
      - name: Should run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.changes.outputs.document }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache HuggingFace models
        if: steps.should-run.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bgem3-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-bgem3-
      - name: Install uv
        if: steps.should-run.outputs.run == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        if: steps.should-run.outputs.run == 'true'
        run: uv python install 3.11
      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: uv sync --extra dev
      - name: Regenerate fixtures
        if: steps.should-run.outputs.run == 'true'
        run: uv run python -m scripts.regenerate_document_fixtures
      - name: Run slow document E2E tests
        if: steps.should-run.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --no-cov: aggregate coverage is enforced by the main `test` job; this
        # subset run would always trip the 90% gate on its own (only 2 tests).
        run: uv run pytest -m document_slow -v --tb=short --no-cov

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Gitleaks (secret scan)
        # Authoritative enforcement of gate §16.2 #6 ("gitleaks limpio").
        # The .pre-commit-config.yaml gitleaks hook is golang-based and
        # cannot build on the Windows dev box (no Go toolchain), so the
        # binding gate runs here on Linux. Version pinned to match
        # .pre-commit-config.yaml (v8.21.2) so local/CI stay in sync.
        # Runs before the heavy deps install so a leak fails fast.
        # --no-git on a fresh checkout scans exactly the tracked files;
        # .gitleaks.toml in the repo root is auto-loaded if present.
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source . --redact --verbose
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bgem3-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-bgem3-
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Bandit
        run: uv run bandit -r src
      - name: Pip-audit
        # --skip-editable: regulaitor (the project itself) is installed editable by uv sync
        #   and is not on PyPI; without this flag pip-audit fails with "Dependency not found".
        # --ignore-vuln CVE-2026-1839: transformers Trainer load — unreachable; see H2 log.
        # --ignore-vuln CVE-2025-69872: diskcache pickle RCE — only exploitable with write
        #   access to the cache dir; RegulAItor's eval cache (evals/cache/) is operator-local,
        #   never exposed externally. No upstream fix in 5.6.3. Re-evaluate when diskcache 6.x
        #   ships a non-pickle default. See docs/technical_decisions_log.md §H8.
        # --ignore-vuln CVE-2026-6587: ragas SSRF in multi_modal_faithfulness module — code
        #   path not exercised by our text-only metric set (faithfulness, answer_relevancy,
        #   context_precision, context_recall). Re-evaluate when ragas releases a fix.
        # --ignore-vuln CVE-2026-41488: langchain-openai TOCTOU/DNS-rebinding SSRF in
        #   _url_to_size() (image token counting). Affected only when openai<2.0 is pinned:
        #   langchain-openai>=1.2 requires openai>=2.26, but our multi-provider router pins
        #   openai>=1.40,<2.0 for groq/openai parity. The vulnerable code path (image URL
        #   fetch for token counting) is never exercised by RegulAItor's text-only eval harness.
        #   No patched 1.1.x release exists on PyPI (fix version 1.1.14 is not published yet).
        #   Re-evaluate when langchain-openai 1.1.14+ appears on PyPI or when openai pin is
        #   relaxed to >=2.0. See docs/technical_decisions_log.md §H12.
        # --ignore-vuln PYSEC-2025-217 (alias CVE-2025-14929): transformers X-CLIP checkpoint
        #   deserialization → arbitrary code execution. Affects all transformers ≤5.0.0-rc0;
        #   no patched 4.x release. RegulAItor uses transformers ONLY transitively via
        #   FlagEmbedding (BGE-M3 embeddings) + sentence-transformers (bge-reranker-v2-m3).
        #   X-CLIP is NOT used; we do NOT load arbitrary user-provided checkpoints (only
        #   pinned models from HuggingFace Hub). Code path unreachable. Mirror precedent
        #   of CVE-2026-1839 (transformers Trainer load, also unreachable). Re-evaluate
        #   when transformers 5.x ships with the fix and our FlagEmbedding/sentence-transformers
        #   pins permit the upgrade.
        run: uv run pip-audit --skip-editable --ignore-vuln CVE-2026-1839 --ignore-vuln CVE-2025-69872 --ignore-vuln CVE-2026-6587 --ignore-vuln CVE-2026-41488 --ignore-vuln PYSEC-2025-217

  frontend:
    name: Frontend (BFF)
    # P1.1 professionalization roadmap: the Next.js BFF is the sovereign-deploy
    # security boundary (per-request nonce-CSP, CSRF same-origin guard, httpOnly
    # cookie, /audit proxy — ADR-0040). 44 vitest cases already exist under
    # frontend_next/tests/; this job gates them so a CSP/CSRF/cookie regression
    # cannot ship on green CI. Node 22 matches the Dockerfile base image.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_next
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Next build (standalone)
        run: npm run build
