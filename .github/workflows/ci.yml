name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bgem3-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-bgem3-
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Mypy
        run: uv run mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bgem3-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-bgem3-
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Pytest
        # Slow tests (BGE-M3 / bge-reranker-v2-m3 + live LanceDB index) require
        # `make ingest && make rag-build` to populate state that's gitignored;
        # they're local-only per spec H3 §11.3 and H2 §11.3.
        run: uv run pytest -m "not slow"

  test-document-e2e:
    name: Document E2E (slow)
    # H5 closure: run the slow document_slow tests on main pushes and on PRs
    # touching the document pipeline. Adversarial fixture is verifiable without
    # ANTHROPIC_API_KEY (sanitizer short-circuits); clean PASS path skips
    # cleanly when the secret is absent.
    runs-on: ubuntu-latest
    # dorny/paths-filter@v3 needs pull-requests:read to list changed files on PRs.
    # contents:read is the default-restricted minimum for checkout.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Detect document pipeline changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            document:
              - 'src/regulaitor/document/**'
              - 'src/regulaitor/orchestration/document_graph.py'
              - 'src/regulaitor/security/injection.py'
              - 'src/regulaitor/security/allowlist.py'
              - 'scripts/analyze.py'
              - 'scripts/regenerate_document_fixtures.py'
              - 'evals/document_cases/**'
      - name: Should run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.changes.outputs.document }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache HuggingFace models
        if: steps.should-run.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bgem3-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-bgem3-
      - name: Install uv
        if: steps.should-run.outputs.run == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        if: steps.should-run.outputs.run == 'true'
        run: uv python install 3.11
      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: uv sync --extra dev
      - name: Regenerate fixtures
        if: steps.should-run.outputs.run == 'true'
        run: uv run python -m scripts.regenerate_document_fixtures
      - name: Run slow document E2E tests
        if: steps.should-run.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest -m document_slow -v --tb=short

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bgem3-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-hf-bgem3-
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Bandit
        run: uv run bandit -r src
      - name: Pip-audit
        # Ignored: CVE-2026-1839 affects transformers.Trainer._load_rng_state, only
        # reachable via Trainer.train(resume_from_checkpoint=...). RegulAItor uses
        # pretrained models via FlagEmbedding -> AutoModel.from_pretrained (safetensors),
        # never instantiates Trainer. See docs/technical_decisions_log.md H2 entry
        # "CVE-2026-1839 transformers — descartada por ruta de código no usada".
        # Re-evaluate when FlagEmbedding releases transformers 5.x compatibility.
        run: uv run pip-audit --ignore-vuln CVE-2026-1839
