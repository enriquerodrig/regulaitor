# Roadmap P3.4 — automated, CI-gated dependency updates so transitive-dep CVEs never
# silently rot again (the exact gap P1.5 exposed: the Security/pip-audit job had been red
# for days because nothing was bumping deps). Every update is a PR that runs the full CI
# (pytest + mypy + ruff/black + frontend + pip-audit/gitleaks + redteam-smoke), so a
# breaking bump (e.g. lancedb's /var/cache change) is caught in review, not on main.
version: 2
updates:
  # Python backend (uv-managed: pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]

  # Next.js BFF frontend (npm: package.json + package-lock.json).
  - package-ecosystem: "npm"
    directory: "/frontend_next"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "frontend"]

  # GitHub Actions pinned in the CI workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
