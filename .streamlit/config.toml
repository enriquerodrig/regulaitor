[server]
port = 7860
address = "0.0.0.0"
headless = true
runOnSave = false
# HF Spaces requires CORS + XSRF disabled to work behind their reverse proxy
# (the proxy rewrites Origin headers; Streamlit's default XSRF check fails
# returning 404/403 if these are not disabled). Safe for HF embed iframe.
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
# Recipe "Legal Navy" — deep navy accent for regulatory/compliance trust signal.
# Palette restricted to neutral + 1 accent + 3 semantic (emerald PASS, rose BLOCK,
# amber RHR — applied per-component in _render.py, NOT in theme). System fonts
# only (Streamlit's "sans serif" uses Source Sans 3 bundled — no web-font fetch).
base = "light"
primaryColor = "#1E40AF"            # blue-800 (deep navy)
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC" # slate-50
textColor = "#1E293B"               # slate-800 (contrast 14:1 vs white — AAA)
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseRadius = "small"                # 4px (tight, modern)
